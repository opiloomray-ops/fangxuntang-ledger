<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>廢柴男子．接案與製香帳務</title>
<style>
:root{--bg:#f7f3ec;--card:#fffdf9;--tx:#2b2620;--mu:#8a8076;--ln:#e6dfd3;--ac:#7a5c3e;--ok:#4f8a5b;--wa:#c98a2b;--bad:#b4533f;--jb:#2f4a6d;--sb:#8a5a2b;--sh:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#171411;--card:#221e1a;--tx:#efe8dd;--mu:#a1978b;--ln:#363029;--ac:#d1a877;--ok:#7fc08c;--wa:#e0aa55;--bad:#e08a75;--jb:#8fb0d9;--sb:#d1a877;--sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}}
body[data-g=jobs]{--ac:var(--jb)}
body[data-g=shop]{--ac:var(--sb)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:760px;margin:0 auto;padding:14px 14px 28px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 2px 12px}
h1{font-size:19px;margin:0;letter-spacing:.02em}
h2{font-size:14px;color:var(--mu);font-weight:500;margin:0}
#gear{font-size:19px;background:var(--card);border:1px solid var(--ln);color:var(--mu);width:38px;height:38px;border-radius:12px;cursor:pointer;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center}
#gear.on{color:var(--ac);border-color:var(--ac)}
#banner{display:block;width:100%;aspect-ratio:3/1;object-fit:cover;border-radius:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--ln);border-radius:16px;margin-bottom:10px;box-shadow:var(--sh)}
.tabs button{flex:1 1 0;padding:10px 6px;border-radius:12px;border:0;background:none;color:var(--mu);font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.tabs button[data-g=jobs].on{background:var(--jb);color:#fff;box-shadow:0 2px 8px rgba(47,74,109,.35)}
.tabs button[data-g=shop].on{background:var(--sb);color:#fff;box-shadow:0 2px 8px rgba(138,90,43,.35)}
.subwrap{display:flex;align-items:center;gap:6px;margin-bottom:14px;overflow-x:auto;padding:2px 1px 4px;scrollbar-width:none}
.subwrap::-webkit-scrollbar{display:none}
.subwrap button{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.subwrap button.on{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.sep{flex:none;width:1px;height:22px;background:var(--ln);margin:0 4px}
button{font:inherit;cursor:pointer}
.b{padding:9px 14px;border-radius:12px;border:1px solid var(--ac);background:var(--card);color:var(--ac);font:inherit;cursor:pointer}
.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.d{color:var(--bad);border-color:var(--bad)}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--ac);background:none;color:var(--ac);margin:6px 6px 0 0;font:inherit;cursor:pointer}
button:disabled{opacity:.5}
textarea,input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:9px;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin:9px 0 3px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.mu{color:var(--mu);font-size:13px}
.warn{color:var(--wa);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:10px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:14px;padding:11px 12px;box-shadow:var(--sh)}
.st.clk{cursor:pointer}
.st .mu{display:block;margin-bottom:2px}
.st b{display:block;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.row{position:relative;padding:11px 44px 11px 12px;border-top:1px solid var(--ln);border-left:3px solid var(--ac);cursor:pointer;margin-left:-2px}
.row:first-child{border-top:0}
.rowact{position:absolute;right:6px;top:50%;transform:translateY(-50%)}
.xb{width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);background:var(--card);color:var(--mu);font-size:17px;line-height:1;cursor:pointer;padding:0}
.xb:hover{color:var(--bad);border-color:var(--bad)}
.ck{width:20px;height:20px;accent-color:var(--ac);cursor:pointer;margin:0}
.bbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.bbar>span:first-child{font-size:14px;font-weight:600;color:var(--ac)}
.grp{font-size:12px;color:var(--ac);font-weight:700;margin:16px 0 4px 2px;letter-spacing:.08em}
.ln{font-size:12px;color:var(--mu);margin-top:3px}
.pv{border:1px dashed var(--ac);border-radius:12px;padding:10px;margin:8px 0;font-size:14px;background:var(--bg)}
.tag{font-size:11px;border:1px solid var(--ln);border-radius:999px;padding:0 7px;margin-left:5px;color:var(--mu);background:var(--bg)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.rr{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.br{display:grid;grid-template-columns:70px 1fr 88px;gap:10px;align-items:center;margin:7px 0;padding:3px 6px;border-radius:10px;font-size:13px;cursor:pointer}
.br.on{background:var(--bg);box-shadow:inset 0 0 0 1px var(--ln)}
.br.on>span:first-child{font-weight:700;color:var(--tx)}
.bx{background:var(--ln);border-radius:999px;height:12px;overflow:hidden}
.bx i{display:block;height:100%;border-radius:999px;transition:width .3s}
.bv{text-align:right;font-variant-numeric:tabular-nums;color:var(--tx)}
#md,#dm{position:fixed;inset:0;background:rgba(20,14,8,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(2px)}
#dm{z-index:10}
#mb,#dbx{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:16px calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.2)}
</style></head>
<body><main>
<div class="head"><h1>廢柴男子．接案與製香帳務</h1><button id="gear" title="設定">⚙</button></div>
<div class="tabs" id="gtabs"><button data-g="jobs">廢柴男子接案工作室</button><button data-g="shop">芳巽堂</button></div>
<div class="subwrap" id="subwrap" hidden></div>

<section id="setp" hidden>
 <div class="card">
  <h2>連線設定（只存在這台裝置的瀏覽器，不會放進程式）</h2>
  <label>Apps Script 網址</label><input id="url" placeholder="https://script.google.com/macros/s/…/exec">
  <label>金鑰</label><input id="key" type="password">
  <div class="btns"><button class="b p" id="save">儲存設定</button><button class="b" id="ping">測試連線</button></div>
  <div id="smsg" class="mu"></div>
 </div>
 <div class="card">
  <h2>備份（下載 CSV，可用 Excel 或 Google 試算表開啟）</h2>
  <div class="btns"><button class="b" data-x="jobs">接案</button><button class="b" data-x="sales">銷售</button><button class="b" data-x="prod">商品</button><button class="b" data-x="mats">材料</button><button class="b" data-x="chan">通路</button><button class="b" data-x="ship">寄售出貨</button><button class="b" data-x="settle">寄售結算</button><button class="b" data-x="stock">入庫</button></div>
  <div class="mu" style="margin-top:8px">建議每週下載一次，存到 Google Drive。</div>
 </div>
</section>

<section id="mainp">
 <img id="banner" alt="" hidden>
 <div class="card" id="entry">
  <textarea id="inp" rows="3"></textarea>
  <div class="btns"><button class="b" id="mic">🎤 語音</button><button class="b p" id="parse">整理</button><button class="b" id="fadd">用表單新增</button></div>
  <div id="pv"></div>
 </div>
 <div class="card" id="repc" hidden>
  <div class="hd"><h2>報表期間</h2><span class="btns" style="margin:0"><button class="b" data-rm="month">月</button><button class="b" data-rm="quarter">季</button><button class="b" data-rm="year">年</button></span></div>
  <div class="btns" style="justify-content:center"><button class="b" id="rprev">◀</button><b id="rlab" style="min-width:150px;text-align:center"></b><button class="b" id="rnext">▶</button><button class="b" id="rnow">本期</button></div>
  <div class="btns"><button class="b p" id="ana">產生分析文字</button></div>
  <textarea id="anat" rows="12" hidden></textarea>
  <div class="btns"><button class="b" id="cpy" hidden>複製全文</button><span id="cpm" class="mu"></span></div>
 </div>
 <div class="grid" id="stats"></div>
 <div class="card" id="mcard" hidden>
  <div class="hd"><h2 id="mt">每月</h2><span class="btns" style="margin:0"><button class="b" id="mprev">◀</button><b id="mlab" style="min-width:84px;text-align:center"></b><button class="b" id="mnext">▶</button><button class="b" id="mall">全部</button></span></div>
  <div class="grid" id="mstats"></div>
  <div id="mbars"></div>
  <div class="btns"><button class="b" id="mopen">看這個月的明細</button></div>
 </div>
 <div class="card" id="c2c" hidden><h2 id="c2t"></h2><div id="c2" style="margin-top:8px"></div></div>
 <div class="card" id="c3c" hidden><h2 id="c3t"></h2><div id="c3" style="margin-top:8px"></div></div>
 <div class="card">
  <div class="hd"><h2 id="lt">紀錄</h2><span class="btns" style="margin:0"><button class="b" id="bm">批量管理</button><button class="b" id="add">＋新增</button><button class="b" id="refresh">重新讀取</button></span></div>
  <div class="bbar" id="bbar" hidden><span id="bcnt">已選 0 筆</span><span class="btns" style="margin:0"><button class="b" id="bsel">全選</button><button class="b" id="bclr">清除</button><button class="b d" id="bdel">刪除所選</button><button class="b" id="bend">結束</button></span></div>
  <div id="list"></div>
  <div id="msg" class="mu"></div>
 </div>
 <div class="card" id="rankc" hidden><h2>銷量排行（依全部非草稿銷售，從熱門到冷門）</h2><div id="rank" style="margin-top:8px"></div></div>
</section>
</main>
<div id="md" hidden><div id="mb"></div></div>
<div id="dm" hidden><div id="dbx"></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=v=>Number(v)||0;
const nt=n=>'NT$'+Math.round(N(n)).toLocaleString();
const nc=n=>'NT$'+(Math.round(N(n)*10)/10).toLocaleString();
const sum=(a,f)=>a.reduce((x,r)=>x+f(r),0);
const agg=(rows,kf,vf)=>{const o={};rows.forEach(r=>{const k=kf(r);o[k]=(o[k]||0)+vf(r)});return o};
const pad=n=>String(n).padStart(2,'0');
const dim=(y,m)=>pad(new Date(y,m,0).getDate());
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ST=['進行中','已完稿','已請款','已入帳'];
const CTYPES=['市集','網路','寄賣','其他'];
const PAL=['#c98a2b','#4f8a5b','#2f4a6d','#b4533f','#7a5c3e','#7a6fa8','#3f8f8f','#c4708a'];
const SHEETS={jobs:'接案',sales:'銷售',prod:'商品',mats:'材料',chan:'通路',ship:'寄售出貨',settle:'寄售結算',stock:'入庫'};
const NATIVE=['jobs','sales','consign','stock','mats','prod','chan'];
const GROUPS={
 jobs:[[['jobs','接案'],['jrep','報表']]],
 shop:[[['sales','銷售'],['consign','寄售'],['stock','入庫']],[['prod','商品'],['mats','材料'],['chan','通路']],[['srep','報表']]]
};
const groupOf=t=>(t==='jobs'||t==='jrep')?'jobs':(t==='set'?'set':'shop');
const HINT={jobs:'一行一案，例：蔡志舜 稿費6500 已入帳\n可加：車資800 餐費340 工作日6/10 客戶Doiiin',
  sales:'一行一場，例：西門 幽谷馥3 單價350 初光1 單價325 車資40 餐費165\n「西門」是簡稱，會自動對應西門紅樓創意市集；可加：收入1650、抽30、日期11/25',
  consign:'出貨：出貨 起璽 伽南香10 11/25 運費120\n結算：結算 起璽 伽南香售出6 單價350 退回1 實收2100 入帳11/30',
  stock:'一行一筆入庫，例：入庫 伽南香 8盒 11/25（批次編號自動產生）',
  mats:'一行一筆進貨，例：11/19 沉香粉 600克 500元 承樂製香廠\n包材例：11/20 壓克力線香盒 100個 2800元 淘寶',
  prod:'一行一個商品，例：伽南香 代號JN 定價350 產出8 粉材 沉香粉24 黏粉8 包材 壓克力線香盒1 別名 沉香\n已存在的商品會更新，只改你有寫的欄位',
  chan:'一行一個子通路，例：西門紅樓創意市集 市集 簡稱西門 抽0\n寄賣店：起璽國際 寄賣 簡稱起璽 抽25 事後結算'};
let cfg=JSON.parse(localStorage.getItem('ledgerCfg')||'{}');
let D={jobs:[],sales:[],prod:[],mats:[],chan:[],ship:[],settle:[],stock:[]},tab=cfg.url?'jobs':'set',pend=[],ed=null;
let MS={jobs:null,sales:null,consign:null},DET={};
let RP={m:'month',y:new Date().getFullYear(),p:new Date().getMonth()+1};
let BM=false,ERR='';
const SEL=new Set();
const CHS=()=>D.chan.map(c=>c.name);
const resolveCh=t=>D.chan.find(c=>c.name===t)||D.chan.find(c=>c.alias&&c.alias===t)||null;
const chOf=n=>resolveCh(n)||{};
const chNames=t=>D.chan.filter(c=>!t||c.type===t).map(c=>c.name);

/* ---------- 連線 ---------- */
const errMsg=e=>({key:'金鑰不對',nosheet:'找不到工作表，請確認分頁名稱',notfound:'找不到這筆紀錄（可能已被刪除）',action:'指令錯誤'})[e]||e||'未知錯誤';
function need(){if(!cfg.url||!cfg.key)throw new Error('請先到「設定」填入網址與金鑰')}
function fromRow(sheet,r){if(sheet==='銷售')r.items=textToItems(r.items);return r}
async function get(sheet){need();const u=new URL(cfg.url);u.searchParams.set('key',cfg.key);u.searchParams.set('sheet',sheet);
 const j=await (await fetch(u)).json();if(!j.ok)throw new Error(errMsg(j.error));return j.rows.map(r=>fromRow(sheet,r))}
async function send(sheet,action,body){need();
 const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:cfg.key,sheet,action},body))});
 const j=await r.json();if(!j.ok)throw new Error(errMsg(j.error));return j}
async function loadAll(){
 if(!cfg.url){$('#msg').textContent='請先到「設定」填入網址與金鑰';return}
 const miss=[];
 try{
  for(const k of Object.keys(SHEETS)){
   try{D[k]=await get(SHEETS[k])}
   catch(e){if(k==='ship'||k==='settle'||k==='stock'){D[k]=[];miss.push(SHEETS[k])}else throw e}
  }
  render();
  $('#msg').textContent=ERR?'畫面錯誤：'+ERR:'已讀取（'+new Date().toLocaleTimeString()+'）'+(miss.length?'；缺少工作表：'+miss.join('、'):'');
 }catch(e){$('#msg').textContent='讀取失敗：'+e.message}
}

/* ---------- 解析 ---------- */
const itemsToText=a=>(a||[]).map(i=>i.name+N(i.qty||1)+(N(i.price)?'@'+N(i.price):'')).join(' ');
const textToItems=t=>String(t??'').split(/\s+/).filter(Boolean).map(x=>{const m=x.match(/^(.+?)(\d+)(?:@(\d+))?$/);return m?{name:m[1],qty:+m[2],price:m[3]?+m[3]:0}:null}).filter(Boolean);
const parseCp=t=>String(t??'').split(/\s+/).filter(Boolean).map(x=>{const m=x.match(/^(.+?)(\d+)$/);return m?{channel:m[1],price:+m[2]}:null}).filter(Boolean);
const dateTok=t=>{const m=t.match(/^(\d{1,2})[\/月](\d{1,2})日?$/);if(!m)return null;return new Date().getFullYear()+'-'+pad(+m[1])+'-'+pad(+m[2])};
const money=(t,k)=>{if(!t.startsWith(k)||!/^\d+$/.test(t.slice(k.length)))return null;return +t.slice(k.length)};
const SKW={車資:'fare',餐費:'meal',攤位費:'stall',攤位:'stall',住宿:'lodging',雜支:'other',總收入:'manualIncome',收入:'manualIncome'};
const JKW={稿費:'fee',車資:'fare',餐費:'meal'};
function parseSales(line){
 let toks=line.trim().split(/\s+/).filter(Boolean);if(!toks.length)return null;
 const f={items:[]},warn=[];
 toks=toks.filter(t=>{const d=dateTok(t);if(d){f.date=d;return false}return true});
 if(!toks.length)return null;
 const head=resolveCh(toks[0]);
 if(head){f.channel=head.name;f.market=head.name;toks=toks.slice(1)}
 else{f.market=toks[0];toks=toks.slice(1)}
 let last=null;
 for(const t of toks){
  let k;
  if((k=t.match(/^單價(\d+)$/))){if(last)last.price=+k[1];else warn.push('「單價」前面沒有商品');continue}
  const kw=Object.keys(SKW).find(x=>money(t,x)!==null);
  if(kw){f[SKW[kw]]=money(t,kw);continue}
  const ch=resolveCh(t);if(ch){f.channel=ch.name;f.market=ch.name;continue}
  if(CTYPES.includes(t)){warn.push('請用子通路的簡稱，不要只寫「'+t+'」');continue}
  if((k=t.match(/^抽(\d+)%?$/))){f.commission=+k[1];continue}
  if((k=t.match(/^(.+?)(\d+)(?:@(\d+))?$/))){last={name:k[1],qty:+k[2],price:k[3]?+k[3]:0};f.items.push(last);continue}
  warn.push('看不懂：'+t);
 }
 return {f,warn};
}
function parseJob(line){
 const toks=line.trim().split(/\s+/).filter(Boolean);if(!toks.length)return null;
 const f={case:toks[0]},warn=[];
 for(const t of toks.slice(1)){
  if(ST.includes(t)){f.status=t;continue}
  const jk=Object.keys(JKW).find(x=>money(t,x)!==null);
  if(jk){f[JKW[jk]]=money(t,jk);continue}
  let c=t.match(/^客戶(.+)$/);if(c){f.client=c[1];continue}
  const d=dateTok(t);if(d){f.workDate=d;continue}
  warn.push('看不懂：'+t);
 }
 const old=D.jobs.find(j=>j.case===f.case);
 if(f.status==='已入帳'&&!(old&&old.paidDate))f.paidDate=today();
 if(f.status==='已請款'&&!(old&&old.invoiceDate))f.invoiceDate=today();
 if(!old){f.status=f.status||'進行中';f.workDate=f.workDate||today();f.draft='正式'}
 return {f,warn,old};
}
const UNIT=u=>u==='g'?'克':u;
function parseMat(line){
 const toks=line.trim().split(/\s+/).filter(Boolean);if(!toks.length)return null;
 const f={date:today()},warn=[],rest=[];
 for(const t of toks){
  const d=dateTok(t);if(d){f.date=d;continue}
  let m;
  if((m=t.match(/^(\d+)(克|g|個|包|盒|條|張)$/))){f.qty=+m[1];f.unit=UNIT(m[2]);continue}
  if((m=t.match(/^(\d+)元$/))){f.price=+m[1];continue}
  rest.push(t);
 }
 if(!rest.length)return null;
 f.name=rest.shift();f.supplier=rest.join(' ');
 if(!f.unit)f.unit='個';
 f.cat=f.unit==='克'?'粉材':'包材';
 if(!f.qty)warn.push('沒有數量（粉材請寫克數，例如 600克）');

const PKEY={定價:'price',產出:'yield',別名:'aliases',大項目:'cat1',系列:'cat2',代號:'code'};
function parseProd(line,c){
 const toks=line.trim().split(/\s+/).filter(Boolean);if(!toks.length)return null;
 const f={name:c.cm[toks[0]]||toks[0]},warn=[],ing=[],pack=[];
 const itm=t=>{const m=t.match(/^(.+?)(\d+)$/);return m?{name:m[1],qty:+m[2]}:null};
 let mode=null;
 const setKey=(key,v)=>{f[key]=(key==='price'||key==='yield')?+String(v).replace(/[^\d.]/g,''):(key==='code'?String(v).toUpperCase():v)};
 for(const t of toks.slice(1)){
  if(mode&&Object.values(PKEY).includes(mode)){setKey(mode,t);mode=null;continue}
  if(mode==='ing'||mode==='pack'){const it=itm(t);if(it){(mode==='ing'?ing:pack).push(it);continue}mode=null}
  if(t==='粉材'){mode='ing';continue}
  if(t==='包材'){mode='pack';continue}
  if(t.startsWith('粉材')){mode='ing';const it=itm(t.slice(2));if(it)ing.push(it);continue}
  if(t.startsWith('包材')){mode='pack';const it=itm(t.slice(2));if(it)pack.push(it);continue}
  const kk=Object.keys(PKEY).find(k=>t.startsWith(k));
  if(kk){const rest=t.slice(kk.length);if(rest)setKey(PKEY[kk],rest);else mode=PKEY[kk];continue}
  warn.push('看不懂：'+t);
 }
 if(ing.length)f.ing=ing.map(i=>i.name+i.qty).join(' ');
 if(pack.length)f.pack=pack.map(i=>i.name+i.qty).join(' ');
 const old=D.prod.find(p=>p.name===f.name);
 if(!old&&(!f.cat1||f.cat1==='線香')){if(f.price==null)warn.push('新商品沒有定價（例：定價350）');if(!f.yield)warn.push('新商品沒有產出盒數（例：產出8）');if(!ing.length)warn.push('新商品沒有粉材用量（例：粉材 沉香粉24）')}
