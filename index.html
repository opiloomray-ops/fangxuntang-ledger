<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>廢柴男子．接案與製香帳務</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2620;--mu:#8a8076;--ln:#e8e1d6;--ac:#7a5c3e;--ok:#4f8a5b;--wa:#c98a2b;--bad:#b4533f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1b1815;--card:#26221e;--tx:#efe8dd;--mu:#a1978b;--ln:#3a342d;--ac:#d1a877;--ok:#7fc08c;--wa:#e0aa55;--bad:#e08a75;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:4px 0 10px}
h2{font-size:14px;color:var(--mu);font-weight:500;margin:0}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{flex:1 1 auto;padding:8px 6px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;font-size:14px}
.tabs button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
button{font:inherit;cursor:pointer}
.b{padding:9px 14px;border-radius:10px;border:1px solid var(--ac);background:none;color:var(--ac)}
.p{background:var(--ac);color:var(--bg)}
.d{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5}
textarea,input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}
.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.mu{color:var(--mu);font-size:13px}
.warn{color:var(--wa);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px}
.st.clk{cursor:pointer}
.st b{display:block;font-size:17px}
.row{padding:10px 0;border-top:1px solid var(--ln);cursor:pointer}
.row:first-child{border-top:0}
.ln{font-size:12px;color:var(--mu);margin-top:2px}
.pv{border:1px dashed var(--ac);border-radius:10px;padding:8px;margin:8px 0;font-size:14px}
.tag{font-size:11px;border:1px solid var(--ln);border-radius:6px;padding:0 5px;margin-left:4px;color:var(--mu)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.rr{text-align:right;white-space:nowrap}
.br{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:13px;cursor:pointer}
.br.on span:first-child{font-weight:700;color:var(--ok)}
.bx{background:var(--ln);border-radius:4px;height:10px;overflow:hidden}
.bx i{display:block;height:100%;background:var(--ac)}
.br.on .bx i{background:var(--ok)}
#md,#dm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
#dm{z-index:10}
#mb,#dbx{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:14px calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
</style></head>
<body><main>
<h1>廢柴男子．接案與製香帳務</h1>
<div class="tabs" id="tabs"><button data-t="jobs">接案</button><button data-t="sales">製香銷售</button><button data-t="prod">商品</button><button data-t="mats">材料</button><button data-t="chan">通路</button><button data-t="set">設定</button></div>

<section id="setp" hidden>
 <div class="card">
  <h2>連線設定（只存在這台裝置的瀏覽器，不會放進程式）</h2>
  <label>Apps Script 網址</label><input id="url" placeholder="https://script.google.com/macros/s/…/exec">
  <label>金鑰</label><input id="key" type="password">
  <div class="btns"><button class="b p" id="save">儲存設定</button><button class="b" id="ping">測試連線</button></div>
  <div id="smsg" class="mu"></div>
 </div>
 <div class="card">
  <h2>備份（下載 CSV，可用 Excel 或 Google 試算表開啟）</h2>
  <div class="btns"><button class="b" data-x="jobs">接案</button><button class="b" data-x="sales">銷售</button><button class="b" data-x="prod">商品</button><button class="b" data-x="mats">材料</button><button class="b" data-x="chan">通路</button></div>
  <div class="mu">建議每週下載一次，存到 Google Drive。</div>
 </div>
</section>

<section id="mainp">
 <div class="card" id="entry">
  <textarea id="inp" rows="3"></textarea>
  <div class="btns"><button class="b" id="mic">🎤 語音</button><button class="b p" id="parse">整理</button></div>
  <div id="pv"></div>
 </div>
 <div class="grid" id="stats"></div>
 <div class="card" id="mcard" hidden>
  <div class="hd"><h2 id="mt">每月</h2><span class="btns" style="margin:0"><button class="b" id="mprev">◀</button><b id="mlab" style="min-width:84px;text-align:center"></b><button class="b" id="mnext">▶</button><button class="b" id="mall">全部</button></span></div>
  <div class="grid" id="mstats"></div>
  <div id="mbars"></div>
  <div class="btns"><button class="b" id="mopen">看這個月的明細</button></div>
 </div>
 <div class="card" id="c2c" hidden><h2 id="c2t"></h2><div id="c2" style="margin-top:6px"></div></div>
 <div class="card">
  <div class="hd"><h2 id="lt">紀錄</h2><span class="btns" style="margin:0"><button class="b" id="add">＋新增</button><button class="b" id="refresh">重新讀取</button></span></div>
  <div id="list"></div>
  <div id="msg" class="mu"></div>
 </div>
 <div class="card" id="rankc" hidden><h2>銷量排行（依全部非草稿銷售，從熱門到冷門）</h2><div id="rank" style="margin-top:6px"></div></div>
</section>
</main>
<div id="md" hidden><div id="mb"></div></div>
<div id="dm" hidden><div id="dbx"></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=v=>Number(v)||0;
const nt=n=>'NT$'+Math.round(N(n)).toLocaleString();
const nc=n=>'NT$'+(Math.round(N(n)*10)/10).toLocaleString();
const sum=(a,f)=>a.reduce((x,r)=>x+f(r),0);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const ST=['進行中','已完稿','已請款','已入帳'];
const DEFCH=['市集','網路','一般購買','寄賣'];
const SHEETS={jobs:'接案',sales:'銷售',prod:'商品',mats:'材料',chan:'通路'};
const HINT={jobs:'一行一案，例：蔡志舜 稿費6500 已入帳\n可加：車資800 餐費340 工作日6/10 客戶Doiiin',
            sales:'一行一場，例：11/25 西門紅樓 幽谷馥3 單價350 初光1 單價325 車資40 餐費165\n可加：收入1650、抽30（抽成%）、寄賣、市集、網路'};
let cfg=JSON.parse(localStorage.getItem('ledgerCfg')||'{}');
let D={jobs:[],sales:[],prod:[],mats:[],chan:[]},tab=cfg.url?'jobs':'set',pend=[],ed=null;
let MS={jobs:null,sales:null},DET={};
const CHS=()=>D.chan.length?D.chan.map(c=>c.name):DEFCH;

/* ---------- 連線 ---------- */
const errMsg=e=>({key:'金鑰不對',nosheet:'找不到工作表，請確認分頁名稱',notfound:'找不到這筆紀錄（可能已被刪除）',action:'指令錯誤'})[e]||e||'未知錯誤';
function need(){if(!cfg.url||!cfg.key)throw new Error('請先到「設定」填入網址與金鑰')}
function fromRow(sheet,r){if(sheet==='銷售')r.items=textToItems(r.items);return r}
async function get(sheet){need();const u=new URL(cfg.url);u.searchParams.set('key',cfg.key);u.searchParams.set('sheet',sheet);
 const j=await (await fetch(u)).json();if(!j.ok)throw new Error(errMsg(j.error));return j.rows.map(r=>fromRow(sheet,r))}
async function send(sheet,action,body){need();
 const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:cfg.key,sheet,action},body))});
 const j=await r.json();if(!j.ok)throw new Error(errMsg(j.error));return j}
async function loadAll(){
 if(!cfg.url){$('#msg').textContent='請先到「設定」填入網址與金鑰';return}
 try{for(const k of Object.keys(SHEETS))D[k]=await get(SHEETS[k]);render();$('#msg').textContent='已讀取（'+new Date().toLocaleTimeString()+'）'}
 catch(e){$('#msg').textContent='讀取失敗：'+e.message}
}

/* ---------- 解析 ---------- */
const itemsToText=a=>(a||[]).map(i=>i.name+N(i.qty||1)+(N(i.price)?'@'+N(i.price):'')).join(' ');
const textToItems=t=>String(t??'').split(/\s+/).filter(Boolean).map(x=>{const m=x.match(/^(.+?)(\d+)(?:@(\d+))?$/);return m?{name:m[1],qty:+m[2],price:m[3]?+m[3]:0}:null}).filter(Boolean);
const parseCp=t=>String(t??'').split(/\s+/).filter(Boolean).map(x=>{const m=x.match(/^(.+?)(\d+)$/);return m?{channel:m[1],price:+m[2]}:null}).filter(Boolean);
const dateTok=t=>{const m=t.match(/^(\d{1,2})[\/月](\d{1,2})日?$/);if(!m)return null;return new Date().getFullYear()+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0')};
const money=(t,k)=>{if(!t.startsWith(k)||!/^\d+$/.test(t.slice(k.length)))return null;return +t.slice(k.length)};
const SKW={車資:'fare',餐費:'meal',攤位費:'stall',攤位:'stall',住宿:'lodging',雜支:'other',總收入:'manualIncome',收入:'manualIncome'};
const JKW={稿費:'fee',車資:'fare',餐費:'meal'};
function parseSales(line){
 let toks=line.trim().split(/\s+/).filter(Boolean);if(!toks.length)return null;
 const f={items:[]},warn=[];
 toks=toks.filter(t=>{const d=dateTok(t);if(d){f.date=d;return false}return true});
 if(!toks.length)return null;
 f.market=toks[0];let last=null;
 for(const t of toks.slice(1)){
  let k;
  if((k=t.match(/^單價(\d+)$/))){if(last)last.price=+k[1];else warn.push('「單價」前面沒有商品');continue}
  const kw=Object.keys(SKW).find(x=>money(t,x)!==null);
  if(kw){f[SKW[kw]]=money(t,kw);continue}
  if(CHS().includes(t)){f.channel=t;if(t==='寄賣')f.settle='事後結算';continue}
  if((k=t.match(/^抽(\d+)%?$/))){f.commission=+k[1];continue}
  if((k=t.match(/^(.+?)(\d+)(?:@(\d+))?$/))){last={name:k[1],qty:+k[2],price:k[3]?+k[3]:0};f.items.push(last);continue}
  warn.push('看不懂：'+t);
 }
 return {f,warn};
}
function parseJob(line){
 const toks=line.trim().split(/\s+/).filter(Boolean);if(!toks.length)return null;
 const f={case:toks[0]},warn=[];
 for(const t of toks.slice(1)){
  if(ST.includes(t)){f.status=t;continue}
  const jk=Object.keys(JKW).find(x=>money(t,x)!==null);
  if(jk){f[JKW[jk]]=money(t,jk);continue}
  let c=t.match(/^客戶(.+)$/);if(c){f.client=c[1];continue}
  const d=dateTok(t);if(d){f.workDate=d;continue}
  warn.push('看不懂：'+t);
 }
 const old=D.jobs.find(j=>j.case===f.case);
 if(f.status==='已入帳'&&!(old&&old.paidDate))f.paidDate=today();
 if(f.status==='已請款'&&!(old&&old.invoiceDate))f.invoiceDate=today();
 if(!old){f.status=f.status||'進行中';f.workDate=f.workDate||today();f.draft='正式'}
 return {f,warn,old};
}

/* ---------- 商品成本與別名 ---------- */
function matCost(){const m={};D.mats.forEach(x=>{const a=m[x.name]=m[x.name]||{p:0,q:0};a.p+=N(x.price);a.q+=N(x.qty)});
 const r={};Object.keys(m).forEach(k=>{r[k]=m[k].q?m[k].p/m[k].q:0});return r}
function prodsDerived(){
 const mc=matCost();
 return D.prod.map(p=>{
  const ingL=textToItems(p.ing),packL=textToItems(p.pack),cpL=parseCp(p.cprices),y=N(p.yield)||1,miss=[];
  const cost=(L,per)=>L.reduce((a,i)=>{if(!(i.name in mc)){miss.push(i.name);return a}return a+i.qty*mc[i.name]/per},0);
  const pw=cost(ingL,y),pk=cost(packL,1);
  return {p,ingL,packL,cpL,pw,pk,t:pw+pk,miss:[...new Set(miss)],empty:!ingL.length&&!packL.length};
 });
}
const priceFor=(d,ch)=>{const r=d.cpL.find(x=>x.channel===ch);return r?r.price:N(d.p.price)};
function ctx(){
 const ds=prodsDerived(),cm={},dd={},cost={};
 D.prod.forEach(p=>{cm[p.name]=p.name;String(p.aliases||'').split(/[、,，\s]+/).filter(Boolean).forEach(a=>{if(!(a in cm))cm[a]=p.name})});
 ds.forEach(d=>{dd[d.p.name]=d;cost[d.p.name]=d.t});
 return {ds,cm,dd,cost};
}
const canon=(c,n)=>c.cm[n]||n;
const cogs=(s,c)=>sum(s.items||[],i=>N(i.qty||1)*(c.cost[canon(c,i.name)]||0));

/* ---------- 統計公式 ---------- */
const inc=s=>(s.items&&s.items.length)?sum(s.items,i=>N(i.qty||1)*N(i.price)):N(s.manualIncome);
const exp=s=>N(s.stall)+N(s.fare)+N(s.meal)+N(s.lodging)+N(s.other);
const comm=s=>inc(s)*N(s.commission)/100;
const net=s=>inc(s)-comm(s)-exp(s);
const real=r=>r.draft!=='草稿';
const byKey=k=>(a,b)=>(b[k]||'').localeCompare(a[k]||'');
const ji=r=>({k:'jobs',i:D.jobs.indexOf(r),n:r.case,s:(r.client||'')+' · '+(r.status||'')+(r.paidDate?' · 入帳 '+r.paidDate:''),a:N(r.fee)});
const si=(r,a)=>({k:'sales',i:D.sales.indexOf(r),n:r.market,s:(r.date||'')+' · '+(r.channel||''),a});

/* ---------- 自然語言整理 ---------- */
function build(){
 const lines=$('#inp').value.split('\n').map(s=>s.trim()).filter(Boolean);
 const lastS=D.sales.filter(real).sort(byKey('date'))[0];
 const c=ctx();
 pend=lines.map(l=>{
  if(tab==='jobs'){const p=parseJob(l);if(!p)return null;return {sheet:'接案',op:p.old?'update':'add',id:p.old&&p.old.id,f:p.f,warn:p.warn}}
  const p=parseSales(l);if(!p)return null;
  const f=p.f,warn=p.warn;
  if(lastS){['channel','settle','commission','stall','fare'].forEach(k=>{
   if(f[k]===undefined&&lastS[k]!==undefined&&lastS[k]!==''){f[k]=lastS[k];warn.push('沿用上一場：'+k+' '+lastS[k])}})}
  f.settle=f.settle||'當場收款';f.commission=f.commission??0;f.channel=f.channel||'市集';f.date=f.date||today();f.draft='正式';
  if(f.settle==='當場收款')f.paidDate=f.date;
  f.items.forEach(i=>{
   const cn=canon(c,i.name);
   if(!c.dd[cn])warn.push('找不到商品「'+i.name+'」，請確認名稱或到商品頁加別名');
   i.name=cn;
   if(!i.price&&c.dd[cn]){i.price=priceFor(c.dd[cn],f.channel);warn.push(cn+' 沿用'+f.channel+'售價 '+i.price)}
   else if(!i.price)warn.push(cn+' 未填單價');
  });
  if(!f.items.length&&!f.manualIncome)warn.push('沒有品項也沒有總收入');
  if(D.sales.some(s=>real(s)&&s.market===f.market&&s.date===f.date))warn.push('同一天同場次已有紀錄，請確認不是重複');
  return {sheet:'銷售',op:'add',f,warn}
 }).filter(Boolean);
 drawPv();
}
function drawPv(){
 if(!pend.length){$('#pv').innerHTML='';return}
 $('#pv').innerHTML=pend.map(p=>{const f=p.f;
  const txt=p.sheet==='接案'
   ?[f.case,f.client,f.status,f.fee?nt(f.fee):'',f.workDate?'工作 '+f.workDate:'',f.paidDate?'入帳 '+f.paidDate:'',f.fare?'車資 '+f.fare:'',f.meal?'餐費 '+f.meal:''].filter(Boolean).join(' · ')
   :[f.date,f.market,f.channel,f.settle,(f.items||[]).map(x=>x.name+'×'+x.qty+(x.price?'@'+x.price:'')).join('、'),f.manualIncome?'總收入 '+nt(f.manualIncome):'',f.stall?'攤位 '+nt(f.stall):'',f.fare?'車資 '+nt(f.fare):'',f.meal?'餐費 '+nt(f.meal):''].filter(Boolean).join(' · ');
  return `<div class="pv"><b>${p.op==='update'?'更新':'新增'}${p.sheet}</b>　${esc(txt)}${p.warn.map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('')}</div>`}).join('')
  +`<div class="btns"><button class="b" id="cancel">取消</button><button class="b" id="draft">存成草稿</button><button class="b p" id="confirm">確認儲存</button></div>`;
}
const toRow=(sheet,f,draft)=>{const o=Object.assign({},f);delete o.id;delete o.op;if(sheet==='銷售')o.items=itemsToText(f.items);if(draft)o.draft='草稿';return o};
async function saveAll(draft){
 $('#msg').textContent='儲存中…';
 try{
  for(const p of pend){const body=toRow(p.sheet,p.f,draft);
   if(p.op==='update')await send(p.sheet,'update',{id:p.id,data:body});
   else await send(p.sheet,'add',{data:body})}
  $('#msg').textContent='已儲存 '+pend.length+' 筆';pend=[];$('#inp').value='';drawPv();await loadAll();
 }catch(e){$('#msg').textContent='儲存失敗：'+e.message}
}

/* ---------- 畫面 ---------- */
function render(){
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 $('#setp').hidden=tab!=='set';$('#mainp').hidden=tab==='set';
 if(tab==='set')return;
 const nat=tab==='jobs'||tab==='sales';
 $('#entry').hidden=!nat;$('#rankc').hidden=tab!=='prod';
 if(nat)$('#inp').placeholder=HINT[tab];
 DET={};
 const c=ctx();
 if(tab==='jobs')renderJobs();
 else if(tab==='sales')renderSales(c);
 else if(tab==='prod')renderProd(c);
 else if(tab==='mats')renderMats();
 else renderChan();
 if(nat){renderMonthly();renderGroups()}else{$('#mcard').hidden=true;$('#c2c').hidden=true}
}
function setStats(list){$('#stats').innerHTML=list.map(s=>`<div class="st${s[2]?' clk':''}"${s[2]?` data-dk="${s[2]}"`:''}><span class="mu">${s[0]}</span><b>${s[1]}</b></div>`).join('')}
function setList(html){$('#list').innerHTML=html||'<div class="mu">尚無紀錄</div>'}
function bars(list){const mx=Math.max(1,...list.map(x=>Math.abs(x.v)));
 return list.map(x=>`<div class="br${x.on?' on':''}"${x.k?` data-m="${esc(x.k)}"`:''}><span>${esc(x.l)}</span><div class="bx"><i style="width:${Math.max(2,Math.abs(x.v)/mx*100)}%"></i></div><span>${x.t}</span></div>`).join('')||'<div class="mu">尚無資料</div>'}
function renderJobs(){
 const rows=D.jobs.slice().sort(byKey('workDate')),r0=rows.filter(real);
 const paidR=r0.filter(r=>r.status==='已入帳'),waitR=r0.filter(r=>r.status!=='已入帳');
 const paid=sum(paidR,r=>N(r.fee)),wait=sum(waitR,r=>N(r.fee));
 DET={paid:{t:'已入帳稿費',sum:nt(paid),items:paidR.map(ji)},wait:{t:'待收款',sum:nt(wait),items:waitR.map(ji)},cnt:{t:'案件明細',sum:r0.length+' 件',items:r0.map(ji)}};
 setStats([['已入帳稿費',nt(paid),'paid'],['待收款',nt(wait),'wait'],['案件數',r0.length,'cnt']]);
 $('#lt').textContent='接案紀錄（點一筆可編輯）';
 setList(rows.map(r=>`<div class="row" data-k="jobs" data-i="${D.jobs.indexOf(r)}"><b>${esc(r.case)}</b>${real(r)?'':'<span class="tag">草稿</span>'}<div class="mu">${esc(r.client||'')} · ${esc(r.status||'')} · 稿費 ${nt(r.fee)}${r.paidDate?' · 入帳 '+esc(r.paidDate):''}</div></div>`).join(''));
}
function renderSales(c){
 const rows=D.sales.slice().sort(byKey('date')),r0=rows.filter(real);
 const I=sum(r0,inc),NT=sum(r0,net),CG=sum(r0,s=>cogs(s,c));
 DET={inc:{t:'收入明細',sum:nt(I),items:r0.map(r=>si(r,inc(r)))},net:{t:'淨利明細',sum:nt(NT),items:r0.map(r=>si(r,net(r)))},cost:{t:'商品成本明細',sum:nt(CG),items:r0.filter(r=>cogs(r,c)>0).map(r=>si(r,cogs(r)))},after:{t:'扣成本後明細',sum:nt(NT-CG),items:r0.map(r=>si(r,net(r)-cogs(r)))},cnt:{t:'場次明細',sum:r0.length+' 場',items:r0.map(r=>si(r,inc(r)))}};
 setStats([['收入',nt(I),'inc'],['淨利',nt(NT),'net'],['商品成本',nt(CG),'cost'],['扣成本後',nt(NT-CG),'after'],['場次',r0.length,'cnt']]);
 $('#lt').textContent='銷售紀錄（點一筆可編輯）';
 setList(rows.map(r=>{const g=cogs(r,c);return `<div class="row" data-k="sales" data-i="${D.sales.indexOf(r)}"><b>${esc(r.market)}</b>${real(r)?'':'<span class="tag">草稿</span>'}<span class="tag">${esc(r.channel||'')}</span><div class="mu">${esc(r.date||'')} · 收入 ${nt(inc(r))} · 淨利 ${nt(net(r))}${g?' · 成本 '+nt(g):''}${(r.items||[]).length?' · '+r.items.map(i=>esc(canon(c,i.name))+'×'+i.qty).join('、'):''}</div></div>`}).join(''));
}
/* 月份：接案以入帳月為準，銷售以入帳日（事後結算需填入帳日）為準 */
function monthsOf(){
 const J=tab==='jobs';
 const rows=J?D.jobs.filter(r=>real(r)&&r.status==='已入帳'):D.sales.filter(real);
 const m={};
 rows.forEach(r=>{const k=J?(r.paidDate||''):(r.paidDate||(r.settle==='事後結算'?'':r.date)||'');if(!k)return;const mm=k.slice(0,7);(m[mm]=m[mm]||[]).push(r)});
 return Object.keys(m).sort().map(k=>({k,rows:m[k]}));
}
function renderMonthly(){
 const J=tab==='jobs',months=monthsOf(),card=$('#mcard');
 card.hidden=!months.length;
 if(!months.length)return;
 let sel=MS[tab];if(sel&&!months.some(m=>m.k===sel)){sel=null;MS[tab]=null}
 const cur=sel?months.find(m=>m.k===sel):null,rows=cur?cur.rows:months.flatMap(m=>m.rows);
 $('#mlab').textContent=cur?cur.k:'全部月份';
 $('#mt').textContent=J?'每月入帳稿費（點長條或按 ◀ ▶ 切換）':'每月收入（點長條或按 ◀ ▶ 切換）';
 $('#mstats').innerHTML=(J?[['入帳稿費',nt(sum(rows,r=>N(r.fee)))],['件數',rows.length]]:[['收入',nt(sum(rows,inc))],['淨利',nt(sum(rows,net))],['場次',rows.length]])
  .map(s=>`<div class="st"><span class="mu">${s[0]}</span><b>${s[1]}</b></div>`).join('');
 $('#mbars').innerHTML=bars(months.map(m=>{const v=J?sum(m.rows,r=>N(r.fee)):sum(m.rows,inc);return {l:m.k.slice(2),k:m.k,on:m.k===sel,v,t:nt(v)}}));
 DET.month={t:(cur?cur.k:'全部月份')+' 明細',sum:J?nt(sum(rows,r=>N(r.fee))):nt(sum(rows,net))+' 淨利',items:rows.map(r=>J?ji(r):si(r,inc(r)))};
}
function stepMonth(d){const months=monthsOf();if(!months.length)return;
 let i=months.findIndex(m=>m.k===MS[tab]);i=i<0?(d>0?-1:months.length):i;
 i=Math.max(0,Math.min(months.length-1,i+d));MS[tab]=months[i].k;renderMonthly()}
function renderGroups(){
 const J=tab==='jobs',rows=J?D.jobs.filter(real):D.sales.filter(real),g={};
 rows.forEach(r=>{const k=J?(r.client||'未填'):(r.channel||'未填');g[k]=(g[k]||0)+(J?N(r.fee):inc(r))});
 $('#c2t').textContent=J?'各客戶稿費（含未收款）':'各通路收入';
 $('#c2').innerHTML=bars(Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({l:k.slice(0,6),v,t:nt(v)})));
 $('#c2c').hidden=false;
}
function renderProd(c){
 const ds=c.ds.slice().sort((a,b)=>((a.p.cat1||'~')+(a.p.cat2||'')).localeCompare((b.p.cat1||'~')+(b.p.cat2||'')));
 const withP=ds.filter(d=>N(d.p.price)&&d.t);
 const avg=withP.length?Math.round(sum(withP,d=>(N(d.p.price)-d.t)/N(d.p.price))/withP.length*100)+'%':'—';
 setStats([['商品數',ds.length],['平均毛利率（一般定價）',avg],['缺進貨價的材料',ds.filter(d=>d.miss.length).length]]);
 $('#lt').textContent='商品（點一筆可編輯配方與定價）';
 setList(ds.map(d=>{const p=d.p,pr=N(p.price),g=pr&&d.t?Math.round((pr-d.t)/pr*100)+'%':'—';
  const lines=D.chan.map(ch=>{const q=priceFor(d,ch.name);if(!q)return'';const cm=N(ch.commission),nn=q*(1-cm/100),gp=nn-d.t;
   return `<div class="ln">${esc(ch.name)}${cm?'（抽 '+cm+'%）':''}：售價 ${nt(q)} → 到手 ${nc(nn)} → 毛利 ${nc(gp)}（${Math.round(gp/q*100)}%）</div>`}).join('');
  return `<div class="row" data-k="prod" data-i="${D.prod.indexOf(p)}"><b>${esc(p.name)}</b>${p.cat1?`<span class="tag">${esc(p.cat1)}${p.cat2?' › '+esc(p.cat2):''}</span>`:''}<div class="mu">${p.aliases?'別名：'+esc(p.aliases)+' · ':''}粉材 ${nc(d.pw)} + 包材 ${nc(d.pk)} ＝ 每盒 ${nc(d.t)}${pr?' · 定價 '+nt(pr)+'（毛利 '+g+'）':''}</div>${d.empty?'<div class="warn">尚未填配方，成本是 0</div>':''}${d.miss.length?`<div class="warn">沒有進貨價的材料：${esc(d.miss.join('、'))}</div>`:''}${lines}</div>`}).join(''));
 const q={};D.sales.filter(real).forEach(s=>(s.items||[]).forEach(i=>{const n=canon(c,i.name);q[n]=(q[n]||0)+N(i.qty||1)}));
 const items=ds.map(d=>({name:d.p.name,q:q[d.p.name]||0,tag:(d.p.cat1||'')+(d.p.cat2?' › '+d.p.cat2:'')})).sort((a,b)=>b.q-a.q);
 const others=Object.keys(q).filter(n=>!c.dd[n]);
 $('#rank').innerHTML=items.map((x,i)=>`<div class="row" style="cursor:default"><b>${i+1}. ${esc(x.name)}</b>${i<3&&x.q?'<span class="tag">🔥熱銷</span>':''}${!x.q?'<span class="tag">沒賣出</span>':''}<span class="tag">${esc(x.tag)}</span><div class="mu">${x.q} 盒</div></div>`).join('')
  +(others.length?`<div class="warn" style="margin-top:8px">未建立商品的名稱：${others.map(n=>esc(n)+' '+q[n]+'盒').join('、')}。請到商品頁新增，或把名稱加進既有商品的別名。</div>`:'');
}
function renderMats(){
 const rows=D.mats.slice().sort(byKey('date'));
 setStats([['進貨筆數',rows.length],['累計進貨金額',nt(sum(rows,m=>N(m.price)))]]);
 $('#lt').textContent='材料進貨（點一筆可修改）';
 setList(rows.map(m=>`<div class="row" data-k="mats" data-i="${D.mats.indexOf(m)}"><b>${esc(m.name)}</b><span class="tag">${esc(m.cat||'')}</span><div class="mu">${esc(m.date||'')} · ${N(m.qty)} ${esc(m.unit||'')} · ${nt(m.price)} · ${esc(m.supplier||'')}${N(m.qty)?' · 單價 '+nc(N(m.price)/N(m.qty))+'／'+esc(m.unit||''):''}</div></div>`).join(''));
}
function renderChan(){
 setStats([['通路數',D.chan.length]]);
 $('#lt').textContent='通路（點一筆可修改抽成）';
 setList(D.chan.map(c=>`<div class="row" data-k="chan" data-i="${D.chan.indexOf(c)}"><b>${esc(c.name)}</b><span class="tag">${esc(c.type||'')}</span><div class="mu">抽成 ${N(c.commission)}% · ${esc(c.settle||'當場收款')}${c.note?' · '+esc(c.note):''}</div></div>`).join(''));
}

/* ---------- 明細視窗 ---------- */
function openDetail(dk){
 const d=DET[dk];if(!d)return;
 $('#dbx').innerHTML=`<h2 style="color:var(--tx);font-size:16px">${esc(d.t)}</h2>`
  +(d.sum!=null?`<div style="font-size:20px;font-weight:600;margin:4px 0 6px">${d.sum}</div>`:'')
  +(d.items.length?d.items.map(x=>`<div class="row" data-k="${x.k}" data-i="${x.i}"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(x.n)}</b><div class="mu">${esc(x.s)}</div></div><b class="rr">${x.a!=null?nt(x.a):''}</b></div></div>`).join(''):'<div class="mu">沒有符合的紀錄</div>')
  +'<div class="btns"><button class="b p" id="dc">關閉</button></div>';
 $('#dm').hidden=false;
}

/* ---------- 備份 CSV ---------- */
function exportCSV(k){
 const F=FORMS[k];
 const head=['ID',...F.f.map(f=>f[1].split('（')[0])];
 const body=D[k].map(r=>[r.id||'',...F.f.map(f=>f[0]==='items'?itemsToText(r.items):(r[f[0]]??''))]);
 const q=v=>{const s=String(v??'');return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
 const csv='\uFEFF'+[head,...body].map(row=>row.map(q).join(',')).join('\r\n');
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 a.download='芳巽堂_'+F.sheet+'_'+today()+'.csv';
 document.body.appendChild(a);a.click();a.remove();
}

/* ---------- 編輯表單 ---------- */
const FJ=[['case','案件'],['client','客戶'],['status','狀態','sel',ST],['workDate','工作日','date'],['fee','稿費','num'],['invoiceDate','請款日','date'],['expectedDate','預計入帳日','date'],['paidDate','入帳日','date'],['fare','車資','num'],['meal','餐費','num'],['draft','紀錄狀態','sel',['正式','草稿']],['note','備註']];
const FS=[['market','場次'],['date','日期','date'],['channel','通路','sel',CHS()],['commission','抽成%','num'],['settle','收款方式','sel',['當場收款','事後結算']],['items','品項（例：幽谷馥3@350 初光1@325）'],['manualIncome','總收入（沒有品項時才填）','num'],['stall','攤位費','num'],['fare','車資','num'],['meal','餐費','num'],['lodging','住宿','num'],['other','雜支','num'],['paidDate','入帳日','date'],['draft','紀錄狀態','sel',['正式','草稿']],['note','備註']];
const FORMS={
 jobs:{sheet:'接案',label:'接案紀錄',f:FJ,def:()=>({workDate:today()})},
 sales:{sheet:'銷售',label:'銷售紀錄',f:FS,def:()=>({date:today(),channel:'市集'})},
 prod:{sheet:'商品',label:'商品配方與定價',f:[['name','商品名稱（銷售紀錄用這個名稱）'],['aliases','別名／舊稱（用、分隔，例：沉香）'],['cat1','大項目（例：線香）'],['cat2','系列（例：研萃）'],['price','一般定價（每盒）','num'],['yield','整批實際產出盒數（已扣耗損）','num'],['ing','整批粉材（例：沉香粉24 黏粉8）'],['pack','每盒包材（例：壓克力線香盒1）'],['cprices','各通路另訂售價（例：寄賣店350，沒寫就用一般定價）']],def:()=>({})},
 mats:{sheet:'材料',label:'材料進貨',f:[['name','材料名稱'],['cat','類別','sel',['粉材','包材','其他']],['date','進貨日','date'],['qty','數量（粉材填克數，包材填個數）','num'],['unit','單位（克、個…）'],['price','總價','num'],['supplier','來源'],['note','備註']],def:()=>({date:today(),cat:'粉材'})},
 chan:{sheet:'通路',label:'通路',f:[['name','通路名稱'],['type','類型','sel',['市集','網路','寄賣','其他']],['commission','抽成%（寄賣填 25、30…）','num'],['settle','收款方式','sel',['當場收款','事後結算']],['note','備註']],def:()=>({type:'市集',commission:0,settle:'當場收款'})}
};
function openForm(k,i){
 const F=FORMS[k],rec=i==null?F.def():D[k][i];ed={k,id:rec.id};
 $('#mb').innerHTML=`<h2 style="color:var(--tx);font-size:16px">${i==null?'新增':'編輯'}${F.label}</h2>`+F.f.map(([fk,l,t,o])=>{
  const v=fk==='items'?itemsToText(rec.items):rec[fk];
  const h=t==='sel'?`<select data-k="${fk}">${(o||[]).concat(v&&!(o||[]).includes(v)?[v]:[]).map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`
   :`<input data-k="${fk}" type="${t==='date'?'date':t==='num'?'number':'text'}" ${t==='num'?'inputmode="decimal" step="any"':''} value="${esc(v??'')}">`;
  return `<label>${l}</label>${h}`}).join('')
  +`<div class="btns"><button class="b" id="mc">取消</button>${i==null?'':'<button class="b d" id="mdel">刪除</button>'}<button class="b p" id="ms">儲存</button></div>`;
 $('#md').hidden=false;
}
async function saveForm(){
 const F=FORMS[ed.k],data={};
 F.f.forEach(([k,l,t])=>{const v=$(`#mb [data-k="${k}"]`).value;data[k]=t==='num'?(v===''?0:+v):v});
 try{if(ed.id)await send(F.sheet,'update',{id:ed.id,data});else await send(F.sheet,'add',{data});$('#md').hidden=true;await loadAll()}
 catch(e){$('#msg').textContent='儲存失敗：'+e.message}
}
async function delForm(){
 if(!ed.id||!confirm('確定要刪除這筆嗎？'))return;
 try{await send(FORMS[ed.k].sheet,'delete',{id:ed.id});$('#md').hidden=true;await loadAll()}
 catch(e){$('#msg').textContent='刪除失敗：'+e.message}
}

/* ---------- 事件 ---------- */
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;pend=[];drawPv();$('#msg').textContent='';render();if(tab!=='set')loadAll()});
$('#add').onclick=()=>{if(tab==='jobs'||tab==='sales')$('#inp').focus();else if(FORMS[tab])openForm(tab,null)};
$('#parse').onclick=()=>{if($('#inp').value.trim())build()};
$('#pv').onclick=e=>{const id=e.target.id;
 if(id==='cancel'){pend=[];drawPv()}
 if(id==='confirm')saveAll(false);
 if(id==='draft')saveAll(true)};
$('#list').onclick=e=>{const r=e.target.closest('.row[data-k]');if(r)openForm(r.dataset.k,+r.dataset.i)};
$('#stats').onclick=e=>{const c=e.target.closest('[data-dk]');if(c)openDetail(c.dataset.dk)};
$('#mprev').onclick=()=>stepMonth(-1);
$('#mnext').onclick=()=>stepMonth(1);
$('#mall').onclick=()=>{MS[tab]=null;renderMonthly()};
$('#mopen').onclick=()=>openDetail('month');
$('#mbars').onclick=e=>{const b=e.target.closest('[data-m]');if(b){MS[tab]=b.dataset.m;renderMonthly()}};
$('#dbx').onclick=e=>{const id=e.target.id;if(id==='dc'){$('#dm').hidden=true;return}
 const r=e.target.closest('.row[data-k]');if(r){$('#dm').hidden=true;openForm(r.dataset.k,+r.dataset.i)}};
$('#dm').onclick=e=>{if(e.target.id==='dm')$('#dm').hidden=true};
$('#mb').onclick=e=>{const id=e.target.id;
 if(id==='mc')$('#md').hidden=true;if(id==='ms')saveForm();if(id==='mdel')delForm()};
$('#md').onclick=e=>{if(e.target.id==='md')$('#md').hidden=true};
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>exportCSV(b.dataset.x));
$('#refresh').onclick=loadAll;
$('#url').value=cfg.url||'';$('#key').value=cfg.key||'';
$('#save').onclick=()=>{cfg={url:$('#url').value.trim(),key:$('#key').value.trim()};localStorage.setItem('ledgerCfg',JSON.stringify(cfg));$('#smsg').textContent='已儲存（只存在這台裝置）'};
$('#ping').onclick=async()=>{try{const r=await get('接案');$('#smsg').textContent='連線成功，接案目前 '+r.length+' 筆'}catch(e){$('#smsg').textContent='連線失敗：'+e.message}};
(()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$('#mic').hidden=true;return}
 const rec=new SR();rec.lang='zh-TW';rec.interimResults=false;let on=false,base='';
 $('#mic').onclick=()=>{if(on){rec.stop();return}base=$('#inp').value;on=true;$('#mic').textContent='聽寫中…（再按結束）';rec.start()};
 rec.onresult=e=>{const t=[...e.results].map(r=>r[0].transcript).join('');$('#inp').value=base+(base&&!base.endsWith('\n')?'\n':'')+t};
 rec.onend=()=>{on=false;$('#mic').textContent='🎤 語音'};
 rec.onerror=()=>{on=false;$('#mic').textContent='🎤 語音';$('#msg').textContent='語音沒有啟動，可以直接打字'};
})();
render();loadAll();
</script></body></html>
