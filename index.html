<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>廢柴男子．接案與製香帳務</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2620;--mu:#8a8076;--ln:#e8e1d6;--ac:#7a5c3e;--ok:#4f8a5b;--wa:#c98a2b;--bad:#b4533f;--jb:#2f4a6d;--sb:#8a5a2b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1b1815;--card:#26221e;--tx:#efe8dd;--mu:#a1978b;--ln:#3a342d;--ac:#d1a877;--ok:#7fc08c;--wa:#e0aa55;--bad:#e08a75;--jb:#8fb0d9;--sb:#d1a877;color-scheme:dark}}
body[data-g=jobs]{--ac:var(--jb)}
body[data-g=shop]{--ac:var(--sb)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:760px;margin:0 auto;padding:14px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
h1{font-size:18px;margin:0}
h2{font-size:14px;color:var(--mu);font-weight:500;margin:0}
#gear{font-size:20px;background:none;border:1px solid transparent;color:var(--mu);padding:2px 8px;border-radius:10px;cursor:pointer}
#gear.on{color:var(--ac);border-color:var(--ln);background:var(--card)}
#banner{display:block;width:100%;aspect-ratio:3/1;object-fit:cover;border-radius:14px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1 1 0;padding:10px 6px;border-radius:12px;border:2px solid;background:var(--card);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.tabs button[data-g=jobs]{border-color:var(--jb);color:var(--jb)}
.tabs button[data-g=shop]{border-color:var(--sb);color:var(--sb)}
.tabs button[data-g=jobs].on{background:var(--jb);color:var(--bg)}
.tabs button[data-g=shop].on{background:var(--sb);color:var(--bg)}
.subwrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px}
.glab{font-size:11px;color:var(--mu);padding:0 2px 0 10px;letter-spacing:.08em}
.glab:first-child{padding-left:0}
.subwrap button{padding:5px 12px;border-radius:999px;border:1px solid var(--ln);background:none;color:var(--mu);font:inherit;font-size:13px;cursor:pointer}
.subwrap button.on{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
.b{padding:9px 14px;border-radius:10px;border:1px solid var(--ac);background:none;color:var(--ac);font:inherit;cursor:pointer}
.p{background:var(--ac);color:var(--bg)}
.d{color:var(--bad);border-color:var(--bad)}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--ac);background:none;color:var(--ac);margin:4px 6px 0 0;font:inherit;cursor:pointer}
button:disabled{opacity:.5}
textarea,input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}
.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.mu{color:var(--mu);font-size:13px}
.warn{color:var(--wa);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px}
.st.clk{cursor:pointer}
.st b{display:block;font-size:18px}
.row{padding:10px 0 10px 10px;border-top:1px solid var(--ln);border-left:3px solid transparent;cursor:pointer}
.row:first-child{border-top:0}
body[data-g] .row{border-left-color:var(--ac)}
.grp{font-size:12px;color:var(--ac);font-weight:600;margin:14px 0 2px;letter-spacing:.05em}
.ln{font-size:12px;color:var(--mu);margin-top:2px}
.pv{border:1px dashed var(--ac);border-radius:10px;padding:8px;margin:8px 0;font-size:14px}
.tag{font-size:11px;border:1px solid var(--ln);border-radius:6px;padding:0 5px;margin-left:4px;color:var(--mu)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.rr{text-align:right;white-space:nowrap}
.br{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:13px;cursor:pointer}
.br.on span:first-child{font-weight:700;color:var(--ok)}
.bx{background:var(--ln);border-radius:4px;height:10px;overflow:hidden}
.bx i{display:block;height:100%;background:var(--ac)}
.br.on .bx i{background:var(--ok)}
#md,#dm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
#dm{z-index:10}
#mb,#dbx{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:14px calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
</style></head>
<body><main>
<div class="head"><h1>廢柴男子．接案與製香帳務</h1><button id="gear" title="設定">⚙</button></div>
<div class="tabs" id="gtabs"><button data-g="jobs">廢柴男子接案工作室</button><button data-g="shop">芳巽堂</button></div>
<div class="subwrap" id="subwrap" hidden></div>

<section id="setp" hidden>
 <div class="card">
  <h2>連線設定（只存在這台裝置的瀏覽器，不會放進程式）</h2>
  <label>Apps Script 網址</label><input id="url" placeholder="https://script.google.com/macros/s/…/exec">
  <label>金鑰</label><input id="key" type="password">
  <div class="btns"><button class="b p" id="save">儲存設定</button><button class="b" id="ping">測試連線</button></div>
  <div id="smsg" class="mu"></div>
 </div>
 <div class="card">
  <h2>備份（下載 CSV，可用 Excel 或 Google 試算表開啟）</h2>
  <div class="btns"><button class="b" data-x="jobs">接案</button><button class="b" data-x="sales">銷售</button><button class="b" data-x="prod">商品</button><button class="b" data-x="mats">材料</button><button class="b" data-x="chan">通路</button><button class="b" data-x="ship">寄售出貨</button><button class="b" data-x="settle">寄售結算</button><button class="b" data-x="stock">入庫</button></div>
  <div class="mu">建議每週下載一次，存到 Google Drive。</div>
 </div>
</section>

<section id="mainp">
 <img id="banner" alt="" hidden>
 <div class="card" id="entry">
  <textarea id="inp" rows="3"></textarea>
  <div class="btns"><button class="b" id="mic">🎤 語音</button><button class="b p" id="parse">整理</button><button class="b" id="fadd">用表單新增</button></div>
  <div id="pv"></div>
 </div>
 <div class="card" id="repc" hidden>
  <div class="hd"><h2>報表期間</h2><span class="btns" style="margin:0"><button class="b" data-rm="month">月</button><button class="b" data-rm="quarter">季</button><button class="b" data-rm="year">年</button></span></div>
  <div class="btns" style="justify-content:center"><button class="b" id="rprev">◀</button><b id="rlab" style="min-width:150px;text-align:center"></b><button class="b" id="rnext">▶</button><button class="b" id="rnow">本期</button></div>
  <div class="btns"><button class="b p" id="ana">產生分析文字</button></div>
  <textarea id="anat" rows="12" hidden></textarea>
  <div class="btns"><button class="b" id="cpy" hidden>複製全文</button><span id="cpm" class="mu"></span></div>
 </div>
 <div class="grid" id="stats"></div>
 <div class="card" id="mcard" hidden>
  <div class="hd"><h2 id="mt">每月</h2><span class="btns" style="margin:0"><button class="b" id="mprev">◀</button><b id="mlab" style="min-width:84px;text-align:center"></b><button class="b" id="mnext">▶</button><button class="b" id="mall">全部</button></span></div>
  <div class="grid" id="mstats"></div>
  <div id="mbars"></div>
  <div class="btns"><button class="b" id="mopen">看這個月的明細</button></div>
 </div>
 <div class="card" id="c2c" hidden><h2 id="c2t"></h2><div id="c2" style="margin-top:6px"></div></div>
 <div class="card" id="c3c" hidden><h2 id="c3t"></h2><div id="c3" style="margin-top:6px"></div></div>
 <div class="card">
  <div class="hd"><h2 id="lt">紀錄</h2><span class="btns" style="margin:0"><button class="b" id="add">＋新增</button><button class="b" id="refresh">重新讀取</button></span></div>
  <div id="list"></div>
  <div id="msg" class="mu"></div>
 </div>
 <div class="card" id="rankc" hidden><h2>銷量排行（依全部非草稿銷售，從熱門到冷門）</h2><div id="rank" style="margin-top:6px"></div></div>
</section>
</main>
<div id="md" hidden><div id="mb"></div></div>
<div id="dm" hidden><div id="dbx"></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=v=>Number(v)||0;
const nt=n=>'NT$'+Math.round(N(n)).toLocaleString();
const nc=n=>'NT$'+(Math.round(N(n)*10)/10).toLocaleString();
const sum=(a,f)=>a.reduce((x,r)=>x+f(r),0);
const agg=(rows,kf,vf)=>{const o={};rows.forEach(r=>{const k=kf(r);o[k]=(o[k]||0)+vf(r)});return o};
const pad=n=>String(n).padStart(2,'0');
const dim=(y,m)=>pad(new Date(y,m,0).getDate());
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ST=['進行中','已完稿','已請款','已入帳'];
const CTYPES=['市集','網路','寄賣','其他'];
const SHEETS={jobs:'接案',sales:'銷售',prod:'商品',mats:'材料',chan:'通路',ship:'寄售出貨',settle:'寄售結算',stock:'入庫'};
const NATIVE=['jobs','sales','consign','stock','mats','prod','chan'];
const GROUPS={
 jobs:[{items:[['jobs','接案'],['jrep','報表']]}],
 shop:[{label:'經營',items:[['sales','銷售'],['consign','寄售'],['stock','入庫']]},{label:'資料',items:[['prod','商品'],['mats','材料'],['chan','通路']]},{label:'報表',items:[['srep','報表']]}]
};
const groupOf=t=>(t==='jobs'||t==='jrep')?'jobs':(t==='set'?'set':'shop');
const HINT={jobs:'一行一案，例：蔡志舜 稿費6500 已入帳\n可加：車資800 餐費340 工作日6/10 客戶Doiiin',
  sales:'一行一場，例：西門 幽谷馥3 單價350 初光1 單價325 車資40 餐費165\n「西門」是簡稱，會自動對應西門紅樓創意市集；可加：收入1650、抽30、日期11/25',
  consign:'出貨：出貨 起璽 伽南香10 11/25 運費120\n結算：結算 起璽 伽南香售出6 單價350 退回1 實收2100 入帳11/30',
  stock:'一行一筆入庫，例：入庫 伽南香 8盒 11/25（批次編號自動產生）',
  mats:'一行一筆進貨，例：11/19 沉香粉 600克 500元 承樂製香廠\n包材例：11/20 壓克力線香盒 100個 2800元 淘寶',
  prod:'一行一個商品，例：伽南香 代號JN 定價350 產出8 粉材 沉香粉24 黏粉8 包材 壓克力線香盒1 別名 沉香\n已存在的商品會更新，只改你有寫的欄位',
  chan:'一行一個子通路，例：西門紅樓創意市集 市集 簡稱西門 抽0\n寄賣店：起璽國際 寄賣 簡稱起璽 抽25 事後結算'};
let cfg=JSON.parse(localStorage.getItem('ledgerCfg')||'{}');
let D={jobs:[],sales:[],prod:[],mats:[],chan:[],ship:[],settle:[],stock:[]},tab=cfg.url?'jobs':'set',pend=[],ed=null;
let MS={jobs:null,sales:null,consign:null},DET={};
let RP={m:'month',y:new Date().getFullYear(),p:new Date().getMonth()+1};
const CHS=()=>D.chan.map(c=>c.name);
const resolveCh=t=>D.chan.find(c=>c.name===t)||D.chan.find(c=>c.alias&&c.alias===t)||null;
const chOf=n=>resolveCh(n)||{};
const chNames=t=>D.chan.filter(c=>!t||c.type===t).map(c=>c.name);

/* ---------- 連線 ---------- */
const errMsg=e=>({key:'金鑰不對',nosheet:'找不到工作表，請確認分頁名稱',notfound:'找不到這筆紀錄（可能已被刪除）',action:'指令錯誤'})[e]||e||'未知錯誤';
function need(){if(!cfg.url||!cfg.key)throw new Error('請先到「設定」填入網址與金鑰')}
function fromRow(sheet,r){if(sheet==='銷售')r.items=textToItems(r.items);return r}
async function get(sheet){need();const u=new URL(cfg.url);u.searchParams.set('key',cfg.key);u.searchParams.set('sheet',sheet);
 const j=await (await fetch(u)).json();if(!j.ok)throw new Error(errMsg(j.error));return j.rows.map(r=>fromRow(sheet,r))}
async function send(sheet,action,body){need();
 const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:cfg.key,sheet,action},body))});
 const j=await r.json();if(!j.ok)throw new Error(errMsg(j.error));return j}
async function loadAll(){
 if(!cfg.url){$('#msg').textContent='請先到「設定」填入網址與金鑰';return}
 const miss=[];
 try{
  for(const k of Object.keys(SHEETS)){
   try{D[k]=await get(SHEETS[k])}
   catch(e){if(k==='ship'||k==='settle'||k==='stock'){D[k]=[];miss.push(SHEETS[k])}else throw e}
  }
  render();
  $('#msg').textContent='已讀取（'+new Date().toLocaleTimeString()+'）'+(miss.length?'；缺少工作表：'+miss.join('、'):'');
 }catch(e){$('#msg').textContent='讀取失敗：'+e.message}
}

/* ---------- 解析 ---------- */
const itemsToText=a=>(a||[]).map(i=>i.name+N(i.qty||1)+(N(i.price)?'@'+N(i.price):'')).join(' ');
const textToItems=t=>String(t??'').split(/\s+/).filter(Boolean).map(x=>{const m=x.match(/^(.+?)(\d+)(?:@(\d+))?$/);return m?{name:m[1],qty:+m[2],price:m[3]?+m[3]:0}:null}).filter(Boolean);
const parseCp=t=>String(t??'').split(/\s+/).filter(Boolean).map(x=>{const m=x.match(/^(.+?)(\d+)$/);return m?{channel:m[1],price:+m[2]}:null}).filter(Boolean);
const dateTok=t=>{const m=t.match(/^(\d{1,2})[\/月](\d{1,2})日?$/);if(!m)return null;return new Date().getFullYear()+'-'+pad(+m[1])+'-'+pad(+m[2])};
const money=(t,k)=>{if(!t.startsWith(k)||!/^\d+$/.test(t.slice(k.length)))return null;return +t.slice(k.length)};
const SKW={車資:'fare',餐費:'meal',攤位費:'stall',攤位:'stall',住宿:'lodging',雜支:'other',總收入:'manualIncome',收入:'manualIncome'};
const JKW={稿費:'fee',車資:'fare',餐費:'meal'};
function parseSales(line){
 let toks=line.trim().split(/\s+/).filter(Boolean);if(!toks.length)return null;
 const f={items:[]},warn=[];
 toks=toks.filter(t=>{const d=dateTok(t);if(d){f.date=d;return false}return true});
 if(!toks.length)return null;
 const head=resolveCh(toks[0]);
 if(head){f.channel=head.name;f.market=head.name;toks=toks.slice(1)}
 else{f.market=toks[0];toks=toks.slice(1)}
 let last=null;
 for(const t of toks){
  let k;
  if((k=t.match(/^單價(\d+)$/))){if(last)last.price=+k[1];else warn.push('「單價」前面沒有商品');continue}
  const kw=Object.keys(SKW).find(x=>money(t,x)!==null);
  if(kw){f[SKW[kw]]=money(t,kw);continue}
  const ch=resolveCh(t);if(ch){f.channel=ch.name;f.market=ch.name;continue}
  if(CTYPES.includes(t)){warn.push('請用子通路的簡稱，不要只寫「'+t+'」');continue}
  if((k=t.match(/^抽(\d+)%?$/))){f.commission=+k[1];continue}
  if((k=t.match(/^(.+?)(\d+)(?:@(\d+))?$/))){last={name:k[1],qty:+k[2],price:k[3]?+k[3]:0};f.items.push(last);continue}
  warn.push('看不懂：'+t);
 }
 return {f,warn};
}
function parseJob(line){
 const toks=line.trim().split(/\s+/).filter(Boolean);if(!toks.length)return null;
 const f={case:toks[0]},warn=[];
 for(const t of toks.slice(1)){
  if(ST.includes(t)){f.status=t;continue}
  const jk=Object.keys(JKW).find(x=>money(t,x)!==null);
  if(jk){f[JKW[jk]]=money(t,jk);continue}
  let c=t.match(/^客戶(.+)$/);if(c){f.client=c[1];continue}
  const d=dateTok(t);if(d){f.workDate=d;continue}
  warn.push('看不懂：'+t);
 }
 const old=D.jobs.find(j=>j.case===f.case);
 if(f.status==='已入帳'&&!(old&&old.paidDate))f.paidDate=today();
 if(f.status==='已請款'&&!(old&&old.invoiceDate))f.invoiceDate=today();
 if(!old){f.status=f.status||'進行中';f.workDate=f.workDate||today();f.draft='正式'}
 return {f,warn,old};
}
const UNIT=u=>u==='g'?'克':u;
function parseMat(line){
 const toks=line.trim().split(/\s+/).filter(Boolean);if(!toks.length)return null;
 const f={date:today()},warn=[],rest=[];
 for(const t of toks){
  const d=dateTok(t);if(d){f.date=d;continue}
  let m;
  if((m=t.match(/^(\d+)(克|g|個|包|盒|條|張)$/))){f.qty=+m[1];f.unit=UNIT(m[2]);continue}
  if((m=t.match(/^(\d+)元$/))){f.price=+m[1];continue}
  rest.push(t);
 }
 if(!rest.length)return null;
 f.name=rest.shift();f.supplier=rest.join(' ');
 if(!f.unit)f.unit='個';
 f.cat=f.unit==='克'?'粉材':'包材';
 if(!f.qty)warn.push('沒有數量（粉材請寫克數，例如 600克）');
 if(f.price==null)warn.push('沒有總價（請寫 500元）');
 return {f,warn};
}
const PKEY={定價:'price',產出:'yield',別名:'aliases',大項目:'cat1',系列:'cat2',代號:'code'};
function parseProd(line,c){
 const toks=line.trim().split(/\s+/).filter(Boolean);if(!toks.length)return null;
 const f={name:c.cm[toks[0]]||toks[0]},warn=[],ing=[],pack=[];
 const itm=t=>{const m=t.match(/^(.+?)(\d+)$/);return m?{name:m[1],qty:+m[2]}:null};
 let mode=null;
 const setKey=(key,v)=>{f[key]=(key==='price'||key==='yield')?+String(v).replace(/[^\d.]/g,''):(key==='code'?String(v).toUpperCase():v)};
 for(const t of toks.slice(1)){
  if(mode&&Object.values(PKEY).includes(mode)){setKey(mode,t);mode=null;continue}
  if(mode==='ing'||mode==='pack'){const it=itm(t);if(it){(mode==='ing'?ing:pack).push(it);continue}mode=null}
  if(t==='粉材'){mode='ing';continue}
  if(t==='包材'){mode='pack';continue}
  if(t.startsWith('粉材')){mode='ing';const it=itm(t.slice(2));if(it)ing.push(it);continue}
  if(t.startsWith('包材')){mode='pack';const it=itm(t.slice(2));if(it)pack.push(it);continue}
  const kk=Object.keys(PKEY).find(k=>t.startsWith(k));
  if(kk){const rest=t.slice(kk.length);if(rest)setKey(PKEY[kk],rest);else mode=PKEY[kk];continue}
  warn.push('看不懂：'+t);
 }
 if(ing.length)f.ing=ing.map(i=>i.name+i.qty).join(' ');
 if(pack.length)f.pack=pack.map(i=>i.name+i.qty).join(' ');
 const old=D.prod.find(p=>p.name===f.name);
 if(!old&&(!f.cat1||f.cat1==='線香')){if(f.price==null)warn.push('新商品沒有定價（例：定價350）');if(!f.yield)warn.push('新商品沒有產出盒數（例：產出8）');if(!ing.length)warn.push('新商品沒有粉材用量（例：粉材 沉香粉24）')}
 if(f.code&&D.prod.some(p=>p.code===f.code&&p.name!==f.name))warn.push('代號 '+f.code+' 已被其他商品使用，請改用第三個字母');
 Object.keys(f).forEach(k=>{if(f[k]===''||f[k]===undefined||f[k]!==f[k])delete f[k]});
 return {f,warn,old};
}
function parseChan(line){
 const toks=line.trim().split(/\s+/).filter(Boolean);if(!toks.length)return null;
 const f={name:toks[0]},warn=[],note=[];
 const old=D.chan.find(c=>c.name===f.name);
 for(const t of toks.slice(1)){
  let m;
  if(CTYPES.includes(t)){f.type=t;continue}
  if((m=t.match(/^簡稱(.+)$/))){f.alias=m[1];continue}
  if((m=t.match(/^抽(\d+)%?$/))){f.commission=+m[1];continue}
  if(t==='事後結算'||t==='當場收款'){f.settle=t;continue}
  note.push(t);
 }
 if(note.length)f.note=note.join(' ');
 if(!old){
  if(!f.type)warn.push('請指定母分類（市集、網路、寄賣、其他）');
  f.commission=f.commission??0;
  f.settle=f.settle||(f.type==='寄賣'?'事後結算':'當場收款');
 }
 return {f,warn,old};
}
const CK={售出:'sold',退回:'returned',耗損:'lost'};
function parseCon(line,c){
 const toks=line.trim().split(/\s+/).filter(Boolean);if(toks.length<2)return null;
 const kind=toks[0]==='結算'?'settle':toks[0]==='出貨'?'ship':null;
 if(!kind)return {kind:null,warn:['行首請寫「出貨」或「結算」']};
 const warn=[],ci=resolveCh(toks[1]),ch=ci?ci.name:toks[1];
 if(!ci)warn.push('「'+toks[1]+'」不在通路裡，請先到通路新增（母分類選寄賣）');
 let date=null,fare=null,other=null,recv=null,paid=null,last=null;
 const map={};
 const get=n=>map[n]=map[n]||{name:n,qty:0,sold:0,returned:0,lost:0,price:0};
 for(const t of toks.slice(2)){
  let m;
  const d=dateTok(t);if(d){date=d;continue}
  if((m=t.match(/^運費(\d+)$/))){fare=+m[1];continue}
  if((m=t.match(/^其他(\d+)$/))){other=+m[1];continue}
  if((m=t.match(/^實收(\d+)$/))){recv=+m[1];continue}
  if(t.startsWith('入帳')&&dateTok(t.slice(2))){paid=dateTok(t.slice(2));continue}
  if((m=t.match(/^單價(\d+)$/))){if(last)last.price=+m[1];else warn.push('單價前面沒有商品');continue}
  if((m=t.match(/^(售出|退回|耗損)(\d+)$/))){if(last)last[CK[m[1]]]+=+m[2];else warn.push('「'+m[1]+'」前面沒有商品');continue}
  if((m=t.match(/^(.+?)(售出|退回|耗損)(\d+)$/))){last=get(canon(c,m[1]));last[CK[m[2]]]+=+m[3];continue}
  if((m=t.match(/^(.+?)(\d+)$/))){last=get(canon(c,m[1]));last.qty+=+m[2];continue}
  warn.push('看不懂：'+t);
 }
 if(!date){date=today();warn.push('沒寫日期，預設今天')}
 const names=Object.keys(map);
 if(!names.length)return {kind,warn:warn.concat(['沒有寫商品']),rows:[]};
 names.forEach(n=>{if(!c.dd[n])warn.push('找不到商品「'+n+'」，請確認名稱或到商品頁加別名')});
 if(kind==='ship'){
  if(fare!=null&&names.length>1)warn.push('運費記在第一項：'+names[0]);
  return {kind,warn,rows:names.map((n,i)=>({date,channel:ch,product:n,qty:map[n].qty,fare:i===0&&fare!=null?fare:0,other:i===0&&other!=null?other:0,note:''}))};
 }
 if(recv!=null&&names.length>1)warn.push('實收記在第一項，多商品請分開記');
 return {kind,warn,rows:names.map((n,i)=>{const x=map[n],sold=x.sold+x.qty;
  let price=x.price;if(!price&&c.dd[n]){price=priceFor(c.dd[n],ch);warn.push(n+' 沿用'+ch+'售價 '+price)}
  return {date,channel:ch,product:n,sold,price,commission:N(ci?ci.commission:0),received:(recv!=null&&i===0)?recv:'',paidDate:paid||'',returned:x.returned,lost:x.lost,note:''}})};
}
function parseStock(line,c){
 let toks=line.trim().split(/\s+/).filter(Boolean);if(toks[0]==='入庫')toks=toks.slice(1);if(!toks.length)return null;
 const f={},warn=[];let pn=null,qty=null;
 for(const t of toks){
  const d=dateTok(t);if(d){f.date=d;continue}
  const m=t.match(/^(\d+)盒?$/);if(m&&qty==null){qty=+m[1];continue}
  if(!pn){pn=canon(c,t);continue}
  warn.push('看不懂：'+t);
 }
 if(!pn)return null;
 f.product=pn;f.qty=qty||0;f.date=f.date||today();
 if(!c.dd[pn])warn.push('找不到商品「'+pn+'」');
 if(!qty)warn.push('沒有盒數（例：伽南香 8盒）');
 const p=c.dd[pn];f.unitCost=p?+p.t.toFixed(2):0;
 f.batch=newBatch(pn,f.date);
 return {f,warn};
}
function build(){
 const lines=$('#inp').value.split('\n').map(s=>s.trim()).filter(Boolean);
 const lastS=D.sales.filter(real).sort(byKey('date'))[0];
 const c=ctx();
 pend=lines.flatMap(l=>{
  if(tab==='jobs'){const p=parseJob(l);if(!p)return [];return [{sheet:'接案',op:p.old?'update':'add',id:p.old&&p.old.id,f:p.f,warn:p.warn}]}
  if(tab==='mats'){const p=parseMat(l);if(!p)return [];return [{sheet:'材料',op:'add',f:p.f,warn:p.warn}]}
  if(tab==='prod'){const p=parseProd(l,c);if(!p)return [];return [{sheet:'商品',op:p.old?'update':'add',id:p.old&&p.old.id,f:p.f,warn:p.warn}]}
  if(tab==='chan'){const p=parseChan(l);if(!p)return [];return [{sheet:'通路',op:p.old?'update':'add',id:p.old&&p.old.id,f:p.f,warn:p.warn}]}
  if(tab==='stock'){const p=parseStock(l,c);if(!p)return [];return [{sheet:'入庫',op:'add',f:p.f,warn:p.warn}]}
  if(tab==='consign'){
   const p=parseCon(l,c);if(!p)return [];
   const rows=p.rows||[];
   if(!p.kind||!rows.length)return [{sheet:'錯誤',op:'none',f:{},warn:p.warn.length?p.warn:['無法辨識這一行']}];
   return rows.map((r,i)=>({sheet:p.kind==='ship'?'寄售出貨':'寄售結算',op:'add',f:r,warn:i===0?p.warn:[]}));
  }
  const p=parseSales(l);if(!p)return [];
  const f=p.f,warn=p.warn;
  if(!f.channel){
   if(lastS&&lastS.channel){f.channel=lastS.channel;warn.push('找不到通路「'+f.market+'」，沿用上一場：'+lastS.channel)}
   else warn.push('沒有指定通路（請用簡稱，例如：西門）');
  }
  const ci=chOf(f.channel);
  if(f.commission===undefined)f.commission=N(ci.commission);
  if(!f.settle)f.settle=ci.settle||'當場收款';
  if(lastS&&lastS.channel===f.channel){['stall','fare'].forEach(k=>{
   if(f[k]===undefined&&lastS[k]!==undefined&&lastS[k]!==''){f[k]=lastS[k];warn.push('沿用上一場：'+k+' '+lastS[k])}})}
  f.date=f.date||today();f.draft='正式';
  if(f.settle==='當場收款')f.paidDate=f.date;
  f.items.forEach(i=>{
   const cn=canon(c,i.name);
   if(!c.dd[cn])warn.push('找不到商品「'+i.name+'」，請確認名稱或到商品頁加別名');
   i.name=cn;
   if(!i.price&&c.dd[cn]){i.price=priceFor(c.dd[cn],f.channel);warn.push(cn+' 沿用'+f.channel+'售價 '+i.price)}
   else if(!i.price)warn.push(cn+' 未填單價');
  });
  if(!f.items.length&&!f.manualIncome)warn.push('沒有品項也沒有總收入');
  if(D.sales.some(s=>real(s)&&s.market===f.market&&s.date===f.date))warn.push('同一天同場次已有紀錄，請確認不是重複');
  return [{sheet:'銷售',op:'add',f,warn}];
 });
 drawPv();
}

  else if(p.sheet==='錯誤')txt='';
  else txt=[f.date,f.market,f.channel,f.settle,(f.items||[]).map(x=>x.name+'×'+x.qty+(x.price?'@'+x.price:'')).join('、'),f.manualIncome?'總收入 '+nt(f.manualIncome):'',f.stall?'攤位 '+nt(f.stall):'',f.fare?'車資 '+nt(f.fare):'',f.meal?'餐費 '+nt(f.meal):''].filter(Boolean).join(' · ');
  return `<div class="pv"><b>${p.op==='none'?'錯誤':p.op==='update'?'更新':'新增'}${esc(p.sheet)}</b>　${esc(txt)}${p.warn.map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('')}</div>`}).join('')
  +`<div class="btns"><button class="b" id="cancel">取消</button>${(tab==='jobs'||tab==='sales')?'<button class="b" id="draft">存成草稿</button>':''}<button class="b p" id="confirm">確認儲存</button></div>`;
}
const toRow=(sheet,f,draft)=>{const o=Object.assign({},f);delete o.id;delete o.op;delete o.warn;if(sheet==='銷售')o.items=itemsToText(f.items);if(draft&&(sheet==='接案'||sheet==='銷售'))o.draft='草稿';return o};
async function syncSale(r){
 const sold=N(r.sold);
 const d={market:r.channel,date:r.date,channel:r.channel,commission:N(r.commission),settle:'事後結算',paidDate:r.paidDate||'',items:sold?r.product+sold+'@'+N(r.price):'',draft:'正式',note:'寄售結算自動產生'};
 if(r.saleId){
  if(sold>0)await send('銷售','update',{id:r.saleId,data:d});
  else{await send('銷售','delete',{id:r.saleId});await send('寄售結算','update',{id:r.id,data:{saleId:''}})}
 }else if(sold>0){const x=await send('銷售','add',{data:d});await send('寄售結算','update',{id:r.id,data:{saleId:x.id}})}
}
async function saveConSettle(list){

 for(const k of Object.keys(g)){
  const rs=g[k],sold=rs.filter(f=>N(f.sold)>0);
  let saleId='';
  if(sold.length){
   const r=await send('銷售','add',{data:{market:rs[0].channel,date:rs[0].date,channel:rs[0].channel,commission:N(rs[0].commission),settle:'事後結算',paidDate:rs[0].paidDate||'',items:sold.map(f=>f.product+N(f.sold)+'@'+N(f.price)).join(' '),draft:'正式',note:'寄售結算自動產生'}});
   saleId=r.id||'';
  }

async function saveAll(draft){

/* ---------- 批次編號 ---------- */
function codeOf(name){const p=D.prod.find(x=>x.name===name);return (p&&p.code)||name.slice(0,2)}
function newBatch(name,date,ignoreId){
 const d=date||today(),y=d.slice(0,4),base=codeOf(name)+d.slice(5,7)+d.slice(8,10);
 const used=D.stock.filter(s=>s.id!==ignoreId&&(s.date||'').slice(0,4)===y&&(s.batch===base||(s.batch||'').startsWith(base+'-'))).map(s=>s.batch);
 if(!used.includes(base))return base;
 let i=2;while(used.includes(base+'-'+i))i++;return base+'-'+i;
}

/* ---------- 商品成本、別名、現貨 ---------- */
function matCost(){const m={};D.mats.forEach(x=>{const a=m[x.name]=m[x.name]||{p:0,q:0};a.p+=N(x.price);a.q+=N(x.qty)});
 const r={};Object.keys(m).forEach(k=>{r[k]=m[k].q?m[k].p/m[k].q:0});return r}
function prodsDerived(){
 const mc=matCost();
 return D.prod.map(p=>{
  const ingL=textToItems(p.ing),packL=textToItems(p.pack),cpL=parseCp(p.cprices),y=N(p.yield)||1,miss=[];
  const cost=(L,per)=>L.reduce((a,i)=>{if(!(i.name in mc)){miss.push(i.name);return a}return a+i.qty*mc[i.name]/per},0);
  const pw=cost(ingL,y),pk=cost(packL,1);
  return {p,ingL,packL,cpL,pw,pk,t:pw+pk,miss:[...new Set(miss)],empty:!ingL.length&&!packL.length};
 });
}
const priceFor=(d,ch)=>{const r=d.cpL.find(x=>x.channel===ch);return r?r.price:N(d.p.price)};
function ctx(){
 const ds=prodsDerived(),cm={},dd={},cost={};
 D.prod.forEach(p=>{cm[p.name]=p.name;String(p.aliases||'').split(/[、,，\s]+/).filter(Boolean).forEach(a=>{if(!(a in cm))cm[a]=p.name})});
 ds.forEach(d=>{dd[d.p.name]=d;cost[d.p.name]=d.t});
 return {ds,cm,dd,cost};
}
const canon=(c,n)=>c.cm[n]||n;
const cogs=(s,c)=>sum(s.items||[],i=>N(i.qty||1)*(c.cost[canon(c,i.name)]||0));
const unitCost=(c,n)=>c.cost[canon(c,n)]||0;
function stockOf(c){
 const m={};const g=n=>m[n]=m[n]||{name:n,made:0,ship:0,ret:0,direct:0,sold:0,lost:0};
 D.stock.forEach(x=>g(canon(c,x.product)).made+=N(x.qty));
 D.ship.forEach(x=>g(canon(c,x.product)).ship+=N(x.qty));
 D.settle.forEach(x=>{const o=g(canon(c,x.product));o.sold+=N(x.sold);o.ret+=N(x.returned);o.lost+=N(x.lost)});
 D.sales.filter(s=>real(s)&&chOf(s.channel).type!=='寄賣').forEach(s=>(s.items||[]).forEach(i=>g(canon(c,i.name)).direct+=N(i.qty||1)));
 return Object.values(m).filter(o=>o.made||o.ship).map(o=>Object.assign(o,{hand:o.made-o.ship+o.ret-o.direct,on:o.ship-o.ret-o.sold-o.lost}));
}

/* ---------- 統計公式 ---------- */
const inc=s=>(s.items&&s.items.length)?sum(s.items,i=>N(i.qty||1)*N(i.price)):N(s.manualIncome);
const exp=s=>N(s.stall)+N(s.fare)+N(s.meal)+N(s.lodging)+N(s.other);
const comm=s=>inc(s)*N(s.commission)/100;
const net=s=>inc(s)-comm(s)-exp(s);
const real=r=>r.draft!=='草稿';
const byKey=k=>(a,b)=>(b[k]||'').localeCompare(a[k]||'');
const ji=r=>({k:'jobs',i:D.jobs.indexOf(r),n:r.case,s:(r.client||'')+' · '+(r.status||'')+(r.paidDate?' · 入帳 '+r.paidDate:''),a:N(r.fee)});
const si=(r,a)=>({k:'sales',i:D.sales.indexOf(r),n:r.market,s:(r.date||'')+' · '+(r.channel||''),a});

/* ---------- 寄售計算 ---------- */
const gross=s=>N(s.sold)*N(s.price);
const recvOf=s=>(s.received===''||s.received==null)?gross(s)-gross(s)*N(s.commission)/100:N(s.received);
const feeOf=s=>N(s.fare)+N(s.other);
const mKey=d=>(d||'').slice(0,7);
const cogsOfS=(s,c)=>N(s.sold)*unitCost(c,s.product);
const lossOfS=(s,c)=>N(s.lost)*unitCost(c,s.product);
const conItem=(r,k)=>k==='settle'
 ?{k:'settle',i:D.settle.indexOf(r),n:r.product+'（'+r.channel+'）',s:(r.date||'')+' · 售出 '+N(r.sold)+' · 入帳'+(r.paidDate?' '+r.paidDate:'待入帳'),a:recvOf(r)}
 :{k:'ship',i:D.ship.indexOf(r),n:'出貨 '+r.product+' '+N(r.qty)+'盒（'+r.channel+'）',s:(r.date||'')+' · 費用 '+nt(feeOf(r)),a:feeOf(r)};
function consignStock(c){
 const m={};
 const add=(ch,pr,f,v)=>{const n=canon(c,pr),k=ch+'|'+n;m[k]=m[k]||{channel:ch,product:n,ship:0,sold:0,ret:0,lost:0};m[k][f]+=v};
 D.ship.forEach(s=>add(s.channel,s.product,'ship',N(s.qty)));
 D.settle.forEach(s=>{add(s.channel,s.product,'sold',N(s.sold));add(s.channel,s.product,'ret',N(s.returned));add(s.channel,s.product,'lost',N(s.lost))});
 return Object.values(m).map(x=>{const on=x.ship-x.sold-x.ret-x.lost;return Object.assign(x,{on,value:Math.max(0,on)*unitCost(c,x.product)})});
}
function consignMonths(c){
 const m={};
 const get=k=>m[k]=m[k]||{k,gross:0,recv:0,cogs:0,loss:0,fees:0,settles:[],ships:[]};
 D.settle.forEach(s=>{if(!s.date)return;const o=get(mKey(s.date));o.gross+=gross(s);o.recv+=recvOf(s);o.cogs+=cogsOfS(s,c);o.loss+=lossOfS(s,c);o.settles.push(s)});
 D.ship.forEach(s=>{if(!s.date)return;const o=get(mKey(s.date));o.fees+=feeOf(s);o.ships.push(s)});
 return Object.values(m).sort((a,b)=>a.k.localeCompare(b.k));
}
const mNet=m=>m.recv-m.cogs-m.loss-m.fees;

/* ---------- 報表期間 ---------- */
function rngOf(m,y,p){
 if(m==='year')return {f:y+'-01-01',t:y+'-12-31',label:y+' 年'};
 if(m==='quarter'){const s=(p-1)*3+1,e=s+2;return {f:y+'-'+pad(s)+'-01',t:y+'-'+pad(e)+'-'+dim(y,e),label:y+' 年 Q'+p+'（'+s+'–'+e+' 月）'}}
 return {f:y+'-'+pad(p)+'-01',t:y+'-'+pad(p)+'-'+dim(y,p),label:y+' 年 '+p+' 月'};
}
const curR=()=>rngOf(RP.m,RP.y,RP.p);
function shiftP(q,d){
 if(q.m==='year')q.y+=d;
 else if(q.m==='quarter'){const t=q.y*4+q.p-1+d;q.y=Math.floor(t/4);q.p=t%4+1}
 else {const t=q.y*12+q.p-1+d;q.y=Math.floor(t/12);q.p=t%12+1}
}

function jobsOf(R){

 const jp=D.jobs.filter(j=>real(j)&&j.status==='已入帳'&&inR(j.paidDate));

function metrics(R,c){
 const inR=d=>!!d&&d>=R.f&&d<=R.t;
 const dir=D.sales.filter(s=>real(s)&&chOf(s.channel).type!=='寄賣'&&inR(s.paidDate||(s.settle==='事後結算'?'':s.date)));
 const direct={inc:sum(dir,inc),comm:sum(dir,comm),exp:sum(dir,exp),cogs:sum(dir,s=>cogs(s,c)),n:dir.length};
 direct.net=direct.inc-direct.comm-direct.exp-direct.cogs;
 const st=D.settle.filter(s=>inR(s.date)),sh=D.ship.filter(s=>inR(s.date));
 const cons={sold:sum(st,s=>N(s.sold)),gross:sum(st,gross),recv:sum(st,recvOf),cogs:sum(st,s=>N(s.sold)*unitCost(c,s.product)),loss:sum(st,s=>N(s.lost)*unitCost(c,s.product)),fees:sum(sh,feeOf),lostQ:sum(st,s=>N(s.lost)),ret:sum(st,s=>N(s.returned))};
 cons.comm=cons.gross-cons.recv;
 cons.net=cons.recv-cons.cogs-cons.loss-cons.fees;
 const q={};dir.forEach(s=>(s.items||[]).forEach(i=>{const n=canon(c,i.name);q[n]=(q[n]||0)+N(i.qty||1)}));
 st.forEach(s=>{const n=canon(c,s.product);q[n]=(q[n]||0)+N(s.sold)});
 const chs=agg(dir,s=>chOf(s.channel).type||'未分類',s=>inc(s)-comm(s)-exp(s)-cogs(s,c));
 if(cons.sold||cons.gross)chs['寄售']=cons.net;
 return {R,direct,cons,q,chs,gross:direct.inc+cons.gross,net:direct.net+cons.net};
}

/* ---------- 備份 CSV ---------- */
function exportCSV(k){
 const F=FORMS[k];
 const head=['ID',...F.f.map(f=>f[1].split('（')[0])];
 const body=D[k].map(r=>[r.id||'',...F.f.map(f=>f[0]==='items'?itemsToText(r.items):(r[f[0]]??''))]);
 const q=v=>{const s=String(v??'');return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
 const csv='\uFEFF'+[head,...body].map(row=>row.map(q).join(',')).join('\r\n');
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 a.download='芳巽堂_'+F.sheet+'_'+today()+'.csv';
 document.body.appendChild(a);a.click();a.remove();
}

  return `<label>${l}</label>${h}`}).join('')

async function saveForm(){
 const F=FORMS[ed.k],data={};
 F.f.forEach(([k,l,t])=>{const v=$(`#mb [data-k="${k}"]`).value;data[k]=t==='num'?(v===''?(k==='received'?'':0):+v):v});
 try{
  if(ed.k==='prod'&&data.code){
   data.code=String(data.code).toUpperCase();
   if(D.prod.some(p=>p.code===data.code&&p.id!==ed.id)){alert('代號「'+data.code+'」已被使用，請改用第三個字母');return}
  }
  if(ed.k==='chan'&&data.alias&&D.chan.some(c=>(c.alias===data.alias||c.name===data.alias)&&c.id!==ed.id)){alert('簡稱「'+data.alias+'」已被使用');return}
  if(ed.k==='stock'&&!ed.id){
   if(!data.batch)data.batch=newBatch(data.product,data.date);
   if(!data.unitCost){const p=ctx().dd[data.product];data.unitCost=p?+p.t.toFixed(2):0}
  }
  if(ed.k==='settle'){
   const old=D.settle.find(x=>x.id===ed.id)||{};
   let id=ed.id;
   if(id)await send('寄售結算','update',{id,data});
   else{const r=await send('寄售結算','add',{data});id=r.id}
   await syncSale(Object.assign({},old,data,{id}));
  }
  else if(ed.id)await send(F.sheet,'update',{id:ed.id,data});
  else await send(F.sheet,'add',{data});
  $('#md').hidden=true;await loadAll();
 }catch(e){$('#msg').textContent='儲存失敗：'+e.message}
}
async function delForm(){

  await send(FORMS[ed.k].sheet,'delete',{id:ed.id});$('#md').hidden=true;await loadAll()
 }catch(e){$('#msg').textContent='刪除失敗：'+e.message}
}
